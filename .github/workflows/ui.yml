name: UI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      invoices: ${{ steps.filter.outputs.invoices }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            invoices:
              - 'invoices/**'
            workflows:
              - '.github/workflows/ui.yml'
              - '.github/scripts/publish-ui-screenshots.mjs'

  test:
    name: UI tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.invoices == 'true' ||
      needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        working-directory: frontend
        run: npm run test:ui

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: frontend/test-results/screenshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  screenshots:
    name: Pull request screenshots
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: >-
      always() &&
      needs.test.result != 'cancelled' &&
      needs.test.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Comment screenshots on the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          TEST_RESULT: ${{ needs.test.result }}
          SCREENSHOT_DIR: screenshots
        run: node .github/scripts/publish-ui-screenshots.mjs
