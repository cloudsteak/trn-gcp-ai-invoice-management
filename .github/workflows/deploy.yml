name: Deploy

on:
  push:
    branches:
      - main

env:
  GCP_REGION: europe-west1
  BACKEND_SERVICE: invoice-processor-backend
  FRONTEND_SERVICE: invoice-processor-frontend

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            workflows:
              - '.github/workflows/**'

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy backend to Cloud Run
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CICD_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          RUNTIME_SA: invoice-processor-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --source . \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --service-account "${RUNTIME_SA}" \
            --build-service-account "projects/${PROJECT_ID}/serviceAccounts/${CICD_SA}" \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=eu,GEMINI_MODEL=gemini-3.1-flash-lite,GEMINI_LOCATION=global,MAX_FILE_SIZE_MB=20,MAX_FILES_PER_BATCH=10,UPLOAD_DIR=/tmp/invoices,CORS_ORIGINS=*" \
            --set-secrets="GCP_PROCESSOR_ID=invoice-gcp-processor-id:latest"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend]
    if: |
      always() &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve backend URL
        id: backend
        run: |
          if [[ -n "${{ secrets.VITE_API_BASE_URL }}" ]]; then
            echo "url=${{ secrets.VITE_API_BASE_URL }}" >> "${GITHUB_OUTPUT}"
          else
            BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" \
              --region "${GCP_REGION}" \
              --format='value(status.url)')"
            echo "url=${BACKEND_URL}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy frontend to Cloud Run
        working-directory: frontend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CICD_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          RUNTIME_SA: invoice-processor-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --source . \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --service-account "${RUNTIME_SA}" \
            --build-service-account "projects/${PROJECT_ID}/serviceAccounts/${CICD_SA}" \
            --set-build-env-vars="VITE_API_BASE_URL=${{ steps.backend.outputs.url }}"
