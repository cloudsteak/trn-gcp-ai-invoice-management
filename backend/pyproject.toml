[project]
name = "invoice-processor-backend"
version = "0.1.0"
description = "Intelligens számlafeldolgozó – FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "google-cloud-documentai==2.24.0",
    "google-genai>=1.0.0",
    "reportlab==4.1.0",
    "openpyxl==3.1.2",
    "aiofiles==23.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf==6.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
